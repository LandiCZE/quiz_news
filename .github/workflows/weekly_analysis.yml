name: Weekly Quiz Facts

on:
  schedule:
    - cron: "0 10 * * 0"  # every Sunday at 10:00 UTC (12:00 Prague time)
  workflow_dispatch:
    inputs:
      weeks_ago:
        description: "1 = last week (default), 0 = the current week so far"
        required: false
        default: "1"
        type: string

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No fetching here — the week is assembled from the seven day files the
      # daily job already wrote. Saturday's file lands at 07:00 UTC today, so
      # all seven exist by now. One LLM call re-ranks the week's best.
      - name: Merge and re-rank the week
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py week --weeks-ago ${{ inputs.weeks_ago || 1 }}

      - name: Render index.html
        run: python render.py

      - name: Commit facts and page
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add facts/ index.html weeks/
          git diff --cached --quiet || git commit -m "chore: weekly facts $(date -u +%Y-W%V)"
          git pull --rebase origin main
          git push origin main
